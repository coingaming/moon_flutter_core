name: moon_core
description: Moon Design System headless UI core widgets for Flutter.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  mix:
    git:
      url: https://github.com/btwld/mix.git
      path: packages/mix

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true